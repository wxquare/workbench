<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="15-tool-usage-er-title 15-tool-usage-er-desc">
<title id="15-tool-usage-er-title">调用与预算：预留、结算和迟到回执</title>
<desc id="15-tool-usage-er-desc">一次实际尝试对应稳定 invocation；恢复不会刷新父 Run 的额度。 结算到预留的现有 FK 只保证同团队，物理上可多行；服务要求同 Run / invocation 且单次结算。 迟到回执先隔离再查证；Token 未知与费用未知分别保持 pending，不能按零结算。</desc>
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827} .muted{fill:#5b6473} .field{font-size:14px} .node-title{font-size:19px;font-weight:600}</style>

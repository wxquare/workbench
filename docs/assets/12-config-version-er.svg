<title id="12-config-version-er-title">配置与版本：发布快照和 Run 固定引用</title>
<desc id="12-config-version-er-desc">省略部分 team_id 外键和当前生效指针，只展示版本冻结的核心关系。 VersionRef = resource_id + version + content_hash；虚线是 runs.versions 中的冻结引用。 active_profile_id 的外键目前只保证同团队，Agent 一致性仍由服务检查。</desc>

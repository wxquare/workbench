<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="13-run-recovery-er-title 13-run-recovery-er-desc">
<title id="13-run-recovery-er-title">执行与恢复：业务会话、租约、中断和检查点</title>
<desc id="13-run-recovery-er-desc">Job generation 管续执行单元；Run epoch 管所有权；恢复保持同一个 run_id。 Lease 还以复合外键绑定同 Thread 的 Run、同 Run 的 Job；这些连线省略，Guard 必须全部核对。 accepted 指针选择唯一有效 ResumeRequest；pending writes 与 checkpoint 父链一起保留。</desc>
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827} .muted{fill:#5b6473} .field{font-size:14px} .node-title{font-size:19px;font-weight:600}</style>

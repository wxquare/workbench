<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="17-schedule-run-er-title 17-schedule-run-er-desc">
<title id="17-schedule-run-er-title">巡检调度：固定工作流、触发去重与独立执行</title>
<desc id="17-schedule-run-er-desc">定时触发按 schedule_id + due_at 去重；手动触发单独留历史。 定时 Fire.run_id 可空：missed / overlap_skipped / denied / unavailable 都不伪造 Run。 服务为每次已受理巡检新建 Thread / Run；工作流版本在 Schedule.payload 和 RunContext 中固定。</desc>

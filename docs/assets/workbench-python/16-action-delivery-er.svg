<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="16-action-delivery-er-title 16-action-delivery-er-desc">
<title id="16-action-delivery-er-title">动作与交付：审批、发送事实和事件外部关联</title>
<desc id="16-action-delivery-er-desc">分析结束、审批通过、发送成功是三个独立状态；unknown 必须可靠查证。 Outbox 当前 FK 允许一个 Action 多行；本期业务只允许一个目标，单例 UK 是 13.10 的待迁移约束。 IncidentLink 只有经可信回执并可追溯 Action 才表示外部交付；当前自动链路仍是合成 / 本地模拟。</desc>

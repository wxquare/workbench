[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-mcp-server"
version = "0.1.0"
description = "Scoped, read-only diagnostic MCP service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==1.30.0", "pydantic>=2,<3", "httpx>=0.28,<1", "PyYAML>=6,<7", "cryptography>=46,<47", "anyio>=4,<5", "starlette>=0.40,<2", "uvicorn>=0.30,<1"]

[project.scripts]
workbench-mcp-server = "workbench_mcp_server.interfaces.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "build>=1,<2", "ruff>=0.12", "setuptools>=75"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

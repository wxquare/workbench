# Replace example.invalid endpoints and verify upstream isolation before enabling scope_enforced.
version: v1
server:
  host: 127.0.0.1
  port: 8000
  local_development: false
  stdio_principal: workbench-agent
  allowed_hosts:
  - 127.0.0.1:*
  - localhost:*
principals:
- id: workbench-agent
  token_secret_ref: env://WORKBENCH_MCP_AGENT_TOKEN
  tools:
  - knowledge_search
  - metrics_query
  - logs_search
  - trace_get
  scopes:
  - team: ExampleTeam
    environment: test
    region: id
    service: checkout
    source_id: demo-knowledge
  - team: ExampleTeam
    environment: test
    region: id
    service: checkout
    source_id: demo-metrics
  - team: ExampleTeam
    environment: test
    region: id
    service: checkout
    source_id: demo-logs
  - team: ExampleTeam
    environment: test
    region: id
    service: checkout
    source_id: demo-trace
sources:
- id: demo-knowledge
  kind: knowledge
  adapter: normalized-http-v1
  # Replace with the Agent API internal KB endpoint before enabling this source.
  endpoint: https://agent.example.invalid/internal/kb/query
  auth_secret_ref: env://WORKBENCH_KNOWLEDGE_TOKEN
  binding_id: demo-knowledge@1
  scopes:
  - team: ExampleTeam
    environment: test
    region: id
    service: checkout
    source_id: demo-knowledge
  # Enable only after verifying the Agent grant and exact scope match.
  scope_enforced: false
  isolation: upstream-enforced
  timeout_seconds: 20
  allowed_source_hosts: []
- id: demo-metrics
  kind: metrics
  adapter: normalized-http-v1
  endpoint: https://metrics-gateway.example.invalid/query
  auth_secret_ref: env://WORKBENCH_METRICS_TOKEN
  binding_id: demo-metrics@1
  scopes:
  - team: ExampleTeam
    environment: test
    region: id
    service: checkout
    source_id: demo-metrics
  scope_enforced: false
  isolation: upstream-enforced
  timeout_seconds: 20
  allowed_source_hosts: []
  templates:
    error_rate:
      parameters:
        route:
          type: string
          allowed:
          - purchase
          - refund
- id: demo-logs
  kind: logs
  adapter: normalized-http-v1
  endpoint: https://logs-gateway.example.invalid/query
  auth_secret_ref: env://WORKBENCH_LOGS_TOKEN
  binding_id: demo-logs@1
  scopes:
  - team: ExampleTeam
    environment: test
    region: id
    service: checkout
    source_id: demo-logs
  scope_enforced: false
  isolation: upstream-enforced
  timeout_seconds: 20
  allowed_source_hosts: []
- id: demo-trace
  kind: trace
  adapter: normalized-http-v1
  endpoint: https://trace-gateway.example.invalid/query
  auth_secret_ref: env://WORKBENCH_TRACE_TOKEN
  binding_id: demo-trace@1
  scopes:
  - team: ExampleTeam
    environment: test
    region: id
    service: checkout
    source_id: demo-trace
  scope_enforced: false
  isolation: upstream-enforced
  timeout_seconds: 20
  allowed_source_hosts: []
cursor_secret_ref: env://WORKBENCH_MCP_CURSOR_KEY
limits:
  deadline_seconds: 20
  global_concurrency: 4
  principal_concurrency: 2
  response_bytes: 262144
  upstream_bytes: 2097152
  window_seconds: 3600
audit:
  redact_fields:
  - customer_id
  - email

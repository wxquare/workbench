# Example only. Replace team/agent IDs after a reviewed deployment.
service:
  mcp_connections:
    - server: web
      credential_scope: read
      team_id: 11111111-1111-1111-1111-111111111111
      agent_id: 22222222-2222-2222-2222-222222222222
      endpoint: https://web-search.example.invalid/mcp
      secret_ref: env://WORKBENCH_WEB_SEARCH_TOKEN
      read_tools:
        - web_search
      # Agent ToolBinding uses permission=web.read; this MCP connection remains read-only.
      tool_conversation_allowed_tools:
        - web_search
      scope_grants:

          domain_policy_id: public-docs-v1
          allowed_result_hosts:
            - docs.example.com
      mapping_policies:
        - tool_name: web_search
          mapping_hash: be23220925cf59ed07953cc28e6a98c49b66fd0ee23e369472efde241a9f4fe3
          schema_hash: 600a4f35e2c8093094e52965199f49dbfdee49344badeb828f5f47f438a4c7b0
          model_input_fields:
            - query
          query_scope_fields: []
          grant_fields:
            - result_limit
            - domain_policy_id
          context_fields:
            - run_id
            - invocation_id
            - query_scope_ref
          protected_targets:
            - [limit]
            - [domain_policy_id]
            - [context, run_id]
            - [context, invocation_id]
            - [context, query_scope_ref]

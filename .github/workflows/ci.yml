name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/agent
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock
      - run: uv sync --frozen
      - name: Verify SQLite version
        run: uv run python -c "import sqlite3; print('SQLite', sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 51, 3), sqlite3.sqlite_version"
      - name: Verify browser harness prerequisites
        run: uv run python -m pytest tests/integration/test_qa_browser_harness.py -q
      - run: uv run python -m pytest -q -ra --durations=25

  mcp-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mcp-server
    env:
      UV_PYTHON: '3.12'
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/mcp-server/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run python -m pytest -q -ra

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock
      - name: Prepare agent environment for script tests
        working-directory: apps/agent
        run: uv sync --frozen
      - run: python3 -m unittest discover -s scripts/tests -v

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check documentation
        env:
          BASE_REF: ${{ github.base_ref }}
          DOCS_SKIP_BUMP: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'docs-typo') && '1' || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 scripts/check_docs.py --base "origin/$BASE_REF"
          else
            python3 scripts/check_docs.py
          fi

  ci-ok:
    if: always()
    needs: [agent, mcp-server, web, scripts, docs]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
